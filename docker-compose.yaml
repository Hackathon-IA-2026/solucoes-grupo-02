services:
    db:
        image: postgres:16-alpine
        container_name: db
        restart: unless-stopped
        environment:
            POSTGRES_USER: ${DB_USER}
            POSTGRES_PASSWORD: ${DB_PASSWORD}
            POSTGRES_DB: ${DB_NAME}
        ports:
            - "5432:5432"
        volumes:
            - pgdata:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
            interval: 5s
            timeout: 5s
            retries: 5

    api:
        build: ./api
        env_file: ./.env
        environment:
            DB_HOST: db
            DB_PORT: 5432
            PORT: 3000
        ports:
            - "3333:3000"
        depends_on:
            db:
                condition: service_healthy

    ai:
        build: ./ai
        env_file: ./.env
        environment:
            API_URL: "http://api:3000"
        volumes:
            - shared_storage:/app/storage
        depends_on:
            - api

    web:
        build: ./web
        env_file:
            - path: ./web/.env
              required: false
        ports:
            - "5173:5173"

volumes:
    pgdata:
    shared_storage:
