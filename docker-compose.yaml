services:
    db:
        image: postgres:16-alpine
        container_name: db
        restart: unless-stopped
        environment:
            POSTGRES_USER: ${DB_USER}
            POSTGRES_PASSWORD: ${DB_PASSWORD}
            POSTGRES_DB: ${DB_NAME}
        ports:
            - "5432:5432"
        volumes:
            - pgdata:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
            interval: 5s
            timeout: 5s
            retries: 5

    api:
        build: ./api
        env_file: ./.env
        environment:
            DB_HOST: db
            DB_PORT: 5432
            PORT: 3333
            AI_SERVICE_URL: "http://copiloto:8000"
        ports:
            - "3333:3333"
        depends_on:
            db:
                condition: service_healthy

    # Pipeline: coleta o DOU, classifica, resume e grava na API (roda e termina).
    # Coletar um dia específico: docker compose run --rm ai python main.py 25-09-2026
    ai:
        build: ./ai
        env_file: ./.env
        environment:
            API_URL: "http://api:3333"
        volumes:
            - shared_storage:/app/storage
        depends_on:
            - api

    # Copiloto (3º LLM): a API chama POST /ask; ele busca os trechos na API e responde.
    # Carga das normas canônicas (uma vez): docker compose run --rm ai python carregar_canonicas.py
    copiloto:
        build: ./ai
        command: ["uvicorn", "servidor:app", "--host", "0.0.0.0", "--port", "8000"]
        env_file: ./.env
        environment:
            API_URL: "http://api:3333"
        restart: unless-stopped

    web:
        build: ./web
        env_file:
            - path: ./web/.env
              required: false
        ports:
            - "5173:5173"

volumes:
    pgdata:
    shared_storage:
